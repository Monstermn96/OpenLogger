services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openlogger
      POSTGRES_USER: openlogger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openlogger}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    networks:
      - openlogger

  backend:
    build: /home/eric/projects/openlogger/backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://openlogger:${POSTGRES_PASSWORD:-openlogger}@postgres:5432/openlogger
    depends_on:
      - postgres
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - openlogger

  frontend:
    build:
      context: /home/eric/projects/openlogger
      dockerfile: frontend.Dockerfile
    ports:
      - "3095:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - openlogger

volumes:
  pgdata:

networks:
  openlogger:
    driver: bridge

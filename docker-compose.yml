services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openlogger
      POSTGRES_USER: openlogger
      POSTGRES_PASSWORD: openlogger
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - openlogger

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://openlogger:openlogger@postgres:5432/openlogger
    depends_on:
      - postgres
    networks:
      - openlogger

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3095:80"
    depends_on:
      - backend
    networks:
      - openlogger

volumes:
  pgdata:

networks:
  openlogger:
    driver: bridge

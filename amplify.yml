version: 1
applications:
  - appRoot: .
    backend:
      phases:
        build:
          commands:
            - npm install
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir .
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm --prefix apps/web run build
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/web/node_modules/**/*

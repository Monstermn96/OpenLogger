version: 1
applications:
  - appRoot: .
    backend:
      phases:
        preBuild:
          commands:
            - echo "Checking AWS environment..."
            - aws sts get-caller-identity || true
            - echo "Setting up CDK environment..."
        build:
          commands:
            - npm install
            - echo "Configuring CDK for deployment..."
            - |
              export CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
              export CDK_DEFAULT_REGION=$AWS_DEFAULT_REGION
              echo "CDK_DEFAULT_ACCOUNT=$CDK_DEFAULT_ACCOUNT"
              echo "CDK_DEFAULT_REGION=$CDK_DEFAULT_REGION"
              npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir .
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm --prefix apps/web run build
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/web/node_modules/**/*
